# ──────────────────────────────────────────────────────────────
#  Build the Quartz site and publish it as an image to GHCR.
#  The server deploys new versions automatically (Watchtower).
# ──────────────────────────────────────────────────────────────

name: notes-image

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: notes-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history: page dates come from git

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ hashFiles('quartz.config.yaml', 'package-lock.json') }}

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Build site
        run: npx quartz build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: public
          file: deploy/Dockerfile
          build-contexts: deploy=deploy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
