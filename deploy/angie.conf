# ──────────────────────────────────────────────────────────────
#  Angie inside the notes image · static Quartz output
#
#  Runs unprivileged on a read-only filesystem: everything
#  writable lives in /tmp. TLS, compression and access logs are
#  handled by the front Angie on the host.
# ──────────────────────────────────────────────────────────────

worker_processes  1;
error_log         stderr  notice;
pid               /tmp/angie.pid;

events {
    worker_connections  256;
}

http {
    include        /etc/angie/mime.types;
    default_type   application/octet-stream;
    charset        utf-8;
    charset_types  text/css text/plain text/xml application/javascript
                   application/json application/rss+xml image/svg+xml;

    access_log     off;
    server_tokens  off;
    sendfile       on;

    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/angie/html;
        index        index.html;

        # Everything comes from this site. Quartz relies on inline
        # scripts and styles (theme switch, SPA navigation), hence
        # 'unsafe-inline'; no external origins are allowed at all.
        add_header  Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"  always;

        error_page  404  /404.html;

        # Quartz links pages without ".html": /folder/note → note.html
        location / {
            try_files  $uri  $uri.html  $uri/  =404;
            expires    -1;
        }

        # Search index, sitemap, RSS: refresh soon after publishing
        location ~* \.(?:json|xml)$ {
            expires  5m;
        }

        # Assets: short cache, file names are not fingerprinted
        location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
            expires  1h;
        }
    }

    # Health check for Docker, reachable only inside the container
    server {
        listen  127.0.0.1:8081;

        location = /healthz {
            default_type  text/plain;
            return        200  "ok\n";
        }
    }
}
